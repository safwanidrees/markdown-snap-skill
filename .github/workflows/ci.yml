name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Users run the committed bundle, so it has to match the source.
      - name: Check the committed bundle is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run build
          git diff --exit-code -- plugins/ || (echo "::error::Run 'npm run build' and commit plugins/" && exit 1)
      - name: Smoke tests (against the committed bundle)
        run: npm test
